name: Build Windows release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Build Release
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release

      - name: Attach EXE to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Filter ZapretLauncher.exe -Recurse |
            Select-Object -First 1
          if (-not $exe) {
            throw "ZapretLauncher.exe was not found in the build folder."
          }
          gh release upload $env:RELEASE_TAG "$($exe.FullName)" --clobber
