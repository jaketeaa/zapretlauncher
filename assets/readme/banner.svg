      <stop stop-color="#171719"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#FFB020" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x2="0" y2="1">
      <stop stop-color="#F2F2F4" stop-opacity=".07"/>
      <stop offset="1" stop-color="#F2F2F4" stop-opacity=".015"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#background)"/>
    <ellipse cx="230" cy="197" rx="510" ry="329" fill="url(#glow)"/>
    <rect x="44" y="44" width="1192" height="312" rx="24" fill="url(#glass)" stroke="#F2F2F4" stroke-opacity=".13"/>
    <path d="M 107 319 H 1173" stroke="#F2F2F4" stroke-opacity=".12"/>
