    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6051"/>
      <stop offset=".45" stop-color="#3a383e"/>
      <stop offset="1" stop-color="#25252a"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffda7a"/>
      <stop offset=".43" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ed8e14"/>
