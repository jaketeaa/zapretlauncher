<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">ZAPRET LAUNCHER</title>
  <desc id="desc">The amber Z application icon next to the ZAPRET LAUNCHER wordmark. Made by JAKETEA.</desc>
  <defs>
